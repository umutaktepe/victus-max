name: Release Automation

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0, leave empty to use Cargo.toml version)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Package Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libsystemd-dev libdbus-1-dev \
            libudev-dev libhidapi-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run test suite
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release

      - name: Package release archive
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            RAW_TAG="${{ inputs.tag }}"
            TAG_NAME="v${RAW_TAG#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v$(sed -n 's/^version = "\(.*\)"/\1/p' src/victus-max-gui/Cargo.toml | head -1)"
          fi
          ARCHIVE_NAME="victus-max-${TAG_NAME}-x86_64.tar.gz"
          mkdir -p dist/bin dist/data dist/driver dist/scripts
          
          cp target/release/victus-max-daemon dist/bin/
          cp target/release/victus-max dist/bin/
          cp target/release/victus-max-cli dist/bin/
          cp target/release/victus-max-tray dist/bin/
          cp target/release/victus-max-overlay dist/bin/
          cp -r data/* dist/data/
          cp -r driver/* dist/driver/
          cp scripts/victus-max-updater.sh dist/scripts/
          cp setup.sh install.sh dist/
          
          tar -czf "$ARCHIVE_NAME" -C dist .
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Victus Max ${{ env.TAG_NAME }}
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
